name: fund-nav-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: probe lixinger fund nav
        env:
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
        run: python probe_fund_nav.py
      - uses: actions/upload-artifact@v4
        with:
          name: fund-nav-result
          path: fund_nav_result.json
