name: Daily index valuation

on:
  schedule:
    # 每个工作日 UTC 09/11/13 各跑一次（北京 17/19/21 点），多个错峰入口防止 GitHub 丢调度。
    # 写入按「日期+代码」合并，多跑几次只会覆盖同一行，幂等无副作用。
    - cron: "0 9,11,13 * * 1-5"
  workflow_dispatch:
    inputs:
      push_all:
        description: "全量推送 temps.json（回填/修复用，填 1）"
        required: false
        default: ""
      lxr_backfill:
        description: "用 lixinger_backfill.json 回填理杏仁列（填 1）"
        required: false
        default: ""
      lxr_start_date:
        description: "理杏仁增量起始日 YYYY-MM-DD（区间修复用）"
        required: false
        default: ""
      lxr_delete_dates:
        description: "按日期删除中证红利行（yyyy/M/d 逗号分隔，清理乱序行用）"
        required: false
        default: ""
      ty_start_date:
        description: "10年国债起始日 YYYY-MM-DD（回填/区间修复用，默认近14天）"
        required: false
        default: ""
      mg_start_date:
        description: "两融列起始日 YYYY-MM-DD（回填/区间修复用，默认近14天）"
        required: false
        default: ""
      pp_start_date:
        description: "收盘价/涨跌幅百分位起始日 YYYY-MM-DD（回填/区间修复用，默认近14天）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - temps.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch & push
        if: github.event_name != 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SHEET_NAME: 指数价格
        run: python fetch_index_valuation.py

      - name: Push 大V温度到 Sheet
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PUSH_ALL: ${{ github.event.inputs.push_all }}
        run: python push_temps.py

      - name: Push 理杏仁等权股息率到 Sheet
        if: github.event_name != 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          LXR_BACKFILL: ${{ github.event.inputs.lxr_backfill }}
          LXR_START_DATE: ${{ github.event.inputs.lxr_start_date }}
          LXR_DELETE_DATES: ${{ github.event.inputs.lxr_delete_dates }}
        run: python fetch_lixinger.py

      - name: Push 10年国债收益率(中债+理杏仁)到红利分表
        if: github.event_name != 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          TY_START_DATE: ${{ github.event.inputs.ty_start_date }}
        run: python fetch_treasury_yield.py

      - name: Push 融资余额两列到指数分表
        if: github.event_name != 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          MG_START_DATE: ${{ github.event.inputs.mg_start_date }}
        run: python fetch_margin.py

      - name: Push 收盘价+涨跌幅百分位到指数分表
        if: github.event_name != 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PP_START_DATE: ${{ github.event.inputs.pp_start_date }}
        run: python fetch_price_percentile.py
