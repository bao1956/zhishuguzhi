name: Export dyr backtest data

# 临时（回测用，用完删）：导出理杏仁4红利指数长历史原始数据并提交回仓库。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Export
        env:
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
        run: python export_dyr_backtest.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dyr_backtest_data.json
          git commit -m "dyr_backtest_data.json 回测原始数据（临时，用完删）" || { echo "无变更"; exit 0; }
          git push
