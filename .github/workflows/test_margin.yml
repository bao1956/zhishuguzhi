name: Test Lixinger margin APIs (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe margin endpoints
        env:
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request

          TOKEN = os.environ["LIXINGER_TOKEN"].strip()

          def post(url, payload):
              payload["token"] = TOKEN
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"httpError": e.code, "body": e.read().decode()[:300]}

          # 1) 指数级两融：四个红利指数 + 上证50 对照
          for code, name in [("000016", "上证50(对照)"), ("000015", "上证红利"),
                             ("000922", "中证红利"), ("H30269", "红利低波"),
                             ("930955", "红利低波100")]:
              r = post("https://open.lixinger.com/api/cn/index/margin-trading-and-securities-lending",
                       {"stockCode": code, "startDate": "2026-07-01", "endDate": "2026-08-04"})
              data = r.get("data")
              if isinstance(data, list):
                  rows = [d for d in data if d.get("financingBalance") is not None]
                  print(f"[指数 {name} {code}] rows={len(data)} 有融资余额的行={len(rows)}")
                  if rows:
                      latest = rows[0]
                      print("   最新:", json.dumps(latest, ensure_ascii=False))
              else:
                  print(f"[指数 {name} {code}] 异常: {json.dumps(r, ensure_ascii=False)[:300]}")

          # 2) 市场级两融（公司接口组权限探测）
          r = post("https://open.lixinger.com/api/cn/company/market-data/margin-trading-and-securities-lending",
                   {"startDate": "2026-07-28", "endDate": "2026-08-04"})
          print("[市场级]", json.dumps(r, ensure_ascii=False)[:400])

          # 3) 个股级两融（招商银行 600036）
          r = post("https://open.lixinger.com/api/cn/company/margin-trading-and-securities-lending",
                   {"stockCode": "600036", "startDate": "2026-07-28", "endDate": "2026-08-04"})
          print("[个股级 600036]", json.dumps(r, ensure_ascii=False)[:400])

          # 4) 宏观信用证券账户
          r = post("https://open.lixinger.com/api/macro/credit-securities-account",
                   {"startDate": "2026-01-01", "endDate": "2026-08-04",
                    "areaCode": "cn", "metricsList": ["m.csa.t"]})
          print("[宏观信用账户]", json.dumps(r, ensure_ascii=False)[:400])
          EOF
